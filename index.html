<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle Ship Mobile - V5.1.1 Collision Fix</title>
<link rel="stylesheet" href="style.css?v=511collision">
</head>
<body>
<div id="mainMenu" class="mainMenu show">
  <div class="mainMenuCard">
    <div class="gameLogo">BATTLE SHIP</div>
    <div class="gameSub">海战</div>
    <div class="versionTag">版本 V5.1.1 Collision Fix</div>
    <button id="startGameBtn">▶ 开始游戏</button>
  </div>
</div>
<div id="game">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hpbox"><span id="hpText">140/140</span><div class="hp"><i id="hpFill"></i></div></div>
    <div class="wave"><b id="wave">WAVE 1</b><small id="remain">敌军 5</small></div>
    <div class="coins">🪙 <b id="coins">0</b><small id="shipLevel">木船</small><small id="shipStats"></small></div>
    <button id="pause">Ⅱ</button>
  </div>

  <div id="joy"><div class="joyRing"></div><i></i></div>

  <div id="skills">
    <button id="repair" class="skill repairSkill">
      <span class="skillIcon">🔧</span>
      <span class="skillName">修船</span>
      <span class="skillCd" id="repairCd">READY</span>
    </button>

    <button id="shock" class="skill shockSkill">
      <span class="skillIcon">⚡</span>
      <span class="skillName">EMP</span>
      <span class="skillCd" id="shockCd">READY</span>
    </button>

    <button id="fire" class="skill heavySkill">
      <span class="skillIcon">💥</span>
      <span class="skillName">舰炮</span>
      <span class="skillCd" id="heavyCd">READY</span>
    </button>
  </div>

  <div id="loading">LOADING BATTLE SHIPS WORLD…</div>
  <div id="battleInfo">
  <span id="zoneName">翡翠海峡</span>
  <small id="objective">摧毁敌舰 · 收集金币 · 升级战船</small>
</div>
<div id="progressPanel">
  <b id="progressTitle">木船</b>
  <span id="progressText">下一阶：小帆船</span>
</div>
<button id="upgradeShip">⬆ 升级船只 <span id="upgradeCost">20</span>🪙</button>
</div>
<script src="game.js?v=511collision"></script>
</body></html>
