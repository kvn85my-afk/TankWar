<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>TankWar V3.1</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#87b5d0;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  color:white;
  z-index:10;
  font-size:20px;
  font-weight:bold;
  text-shadow:2px 2px 5px black;
}

#gameTitle{
  color:#ffd52a;
  font-size:26px;
  margin-bottom:5px;
}

#controls{
  position:fixed;
  left:20px;
  bottom:20px;
  z-index:20;
}

.row{
  display:flex;
}

.ctrl{
  width:70px;
  height:70px;
  margin:4px;
  border-radius:17px;
  border:3px solid white;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:30px;
}

#fire{
  position:fixed;
  right:22px;
  bottom:28px;
  width:110px;
  height:110px;
  border-radius:50%;
  border:5px solid white;
  background:#e32b18;
  color:white;
  font-size:23px;
  font-weight:bold;
  z-index:20;
  box-shadow:0 0 18px #ff5a22;
}

#crosshair{
  position:fixed;
  left:50%;
  top:44%;
  transform:translate(-50%,-50%);
  color:white;
  font-size:36px;
  opacity:.7;
  z-index:5;
}
</style>
</head>

<body>

<div id="hud">
  <div id="gameTitle">TANK WAR V3.1</div>
  ❤️ HP: <span id="hp">100</span><br>
  🎯 敌军: <span id="enemyCount">5</span>
</div>

<div id="crosshair">＋</div>

<div id="controls">
  <div style="text-align:center">
    <button class="ctrl" id="up">▲</button>
  </div>

  <div class="row">
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="down">▼</button>
    <button class="ctrl" id="right">▶</button>
  </div>
</div>

<button id="fire">FIRE</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

// =====================
// BASIC SCENE
// =====================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b5d0);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  300
);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

document.body.appendChild(renderer.domElement);


// =====================
// LIGHT
// =====================

const ambient = new THREE.AmbientLight(
  0xffffff,
  1.5
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
  0xffffff,
  2
);

sun.position.set(
  15,
  25,
  10
);

scene.add(sun);


// =====================
// GROUND
// =====================

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({
    color:0x58733e
  })
);

ground.rotation.x = -Math.PI/2;
scene.add(ground);


// =====================
// ROAD
// =====================

const road = new THREE.Mesh(
  new THREE.PlaneGeometry(18,180),
  new THREE.MeshStandardMaterial({
    color:0x555555
  })
);

road.rotation.x = -Math.PI/2;
road.position.y = 0.02;

scene.add(road);


// =====================
// CREATE TANK
// =====================

function createTank(color){

  const tank = new THREE.Group();

  const armour = new THREE.MeshStandardMaterial({
    color:color
  });

  const dark = new THREE.MeshStandardMaterial({
    color:0x202020
  });

  const wheelMaterial =
    new THREE.MeshStandardMaterial({
      color:0x343434
    });


  // MAIN LOWER BODY

  const lower = new THREE.Mesh(
    new THREE.BoxGeometry(
      4.4,
      0.8,
      6
    ),
    armour
  );

  lower.position.y = 1.15;
  tank.add(lower);


  // UPPER BODY

  const upper = new THREE.Mesh(
    new THREE.BoxGeometry(
      3.7,
      0.8,
      4.5
    ),
    armour
  );

  upper.position.set(
    0,
    1.85,
    -0.2
  );

  tank.add(upper);


  // FRONT ARMOUR

  const front = new THREE.Mesh(
    new THREE.BoxGeometry(
      3.8,
      0.8,
      1.3
    ),
    armour
  );

  front.position.set(
    0,
    1.8,
    -2.45
  );

  front.rotation.x = 0.22;

  tank.add(front);


  // =====================
  // TRACKS
  // =====================

  [-2.35,2.35].forEach(function(x){

    const track = new THREE.Mesh(
      new THREE.BoxGeometry(
        0.85,
        1.05,
        6.4
      ),
      dark
    );

    track.position.set(
      x,
      0.78,
      0
    );

    tank.add(track);


    // WHEELS

    const positions = [
      -2.4,
      -1.45,
      -0.5,
      0.5,
      1.45,
      2.4
    ];

    positions.forEach(function(z){

      const wheel =
        new THREE.Mesh(
          new THREE.CylinderGeometry(
            0.42,
            0.42,
            0.2,
            16
          ),
          wheelMaterial
        );

      wheel.rotation.z =
        Math.PI/2;

      wheel.position.set(
        x > 0 ? 2.8 : -2.8,
        0.8,
        z
      );

      tank.add(wheel);

    });

  });


  // =====================
  // TURRET
  // =====================

  const turret =
    new THREE.Group();


  const turretBase =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        1.5,
        1.65,
        0.8,
        12
      ),
      armour
    );

  turretBase.position.y = 2.55;

  turret.add(turretBase);


  // TOP

  const top =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.2,
        0.45,
        2.4
      ),
      armour
    );

  top.position.set(
    0,
    3.05,
    0
  );

  turret.add(top);


  // HATCH

  const hatch =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.45,
        0.45,
        0.25,
        16
      ),
      dark
    );

  hatch.position.set(
    0.45,
    3.4,
    0.2
  );

  turret.add(hatch);


  // BARREL

  const barrel =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.17,
        0.22,
        5,
        12
      ),
      dark
    );

  barrel.rotation.x =
    Math.PI/2;

  barrel.position.set(
    0,
    2.7,
    -3.7
  );

  turret.add(barrel);


  // MUZZLE

  const muzzle =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.27,
        0.27,
        0.6,
        12
      ),
      dark
    );

  muzzle.rotation.x =
    Math.PI/2;

  muzzle.position.set(
    0,
    2.7,
    -6.2
  );

  turret.add(muzzle);


  tank.add(turret);

  return tank;
}


// =====================
// PLAYER
// =====================

const player =
  createTank(0x355c2e);

player.position.set(
  0,
  0,
  15
);

scene.add(player);


// =====================
// ENEMY
// =====================

const enemies = [];

const enemyPos = [

  [-9,0,-15],
  [9,0,-23],
  [-15,0,-35],
  [14,0,-48],
  [0,0,-62]

];

enemyPos.forEach(function(pos){

  const enemy =
    createTank(0x8a3027);

  enemy.position.set(
    pos[0],
    pos[1],
    pos[2]
  );

  enemy.rotation.y =
    Math.PI;

  enemy.scale.set(
    0.85,
    0.85,
    0.85
  );

  scene.add(enemy);

  enemies.push(enemy);

});


// =====================
// TREES
// =====================

function makeTree(x,z){

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.3,
        0.4,
        2.5,
        8
      ),
      new THREE.MeshStandardMaterial({
        color:0x654321
      })
    );

  trunk.position.set(
    x,
    1.25,
    z
  );

  scene.add(trunk);


  const leaves =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        1.8,
        4,
        8
      ),
      new THREE.MeshStandardMaterial({
        color:0x24552a
      })
    );

  leaves.position.set(
    x,
    4,
    z
  );

  scene.add(leaves);

}

for(let i=0;i<25;i++){

  let x =
    (Math.random()-0.5)*70;

  if(Math.abs(x)<11){

    x +=
      x < 0
      ? -14
      : 14;

  }

  makeTree(
    x,
    Math.random()*100-65
  );

}


// =====================
// CONTROL
// =====================

const keys = {
  up:false,
  down:false,
  left:false,
  right:false
};

function bind(id,key){

  const button =
    document.getElementById(id);

  button.addEventListener(
    "touchstart",
    function(e){

      e.preventDefault();

      keys[key]=true;

    }
  );

  button.addEventListener(
    "touchend",
    function(e){

      e.preventDefault();

      keys[key]=false;

    }
  );

  button.addEventListener(
    "touchcancel",
    function(){

      keys[key]=false;

    }
  );

}

bind("up","up");
bind("down","down");
bind("left","left");
bind("right","right");


// =====================
// BULLETS
// =====================

const bullets = [];

function fire(){

  const direction =
    new THREE.Vector3(
      Math.sin(player.rotation.y),
      0,
      -Math.cos(player.rotation.y)
    );


  const bullet =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        0.25,
        10,
        10
      ),
      new THREE.MeshBasicMaterial({
        color:0xffcc00
      })
    );


  bullet.position.copy(
    player.position
  );

  bullet.position.y = 2.7;

  bullet.position.add(
    direction.clone()
    .multiplyScalar(6)
  );


  bullet.userData.direction =
    direction;


  scene.add(bullet);

  bullets.push(bullet);


  // FLASH

  const flash =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        0.6,
        8,
        8
      ),
      new THREE.MeshBasicMaterial({
        color:0xff7b00
      })
    );

  flash.position.copy(
    bullet.position
  );

  scene.add(flash);

  setTimeout(function(){

    scene.remove(flash);

  },80);

}


document
.getElementById("fire")
.addEventListener(
  "touchstart",
  function(e){

    e.preventDefault();
    fire();

  }
);


// =====================
// EXPLOSION
// =====================

const particles = [];

function explode(position){

  for(let i=0;i<25;i++){

    const particle =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          0.2,
          6,
          6
        ),
        new THREE.MeshBasicMaterial({
          color:
          Math.random()>0.5
          ?0xff4500
          :0xffbb00
        })
      );


    particle.position.copy(
      position
    );

    particle.position.y += 1.5;


    particle.userData.velocity =
      new THREE.Vector3(

        (Math.random()-0.5)*0.35,

        Math.random()*0.35,

        (Math.random()-0.5)*0.35

      );


    particle.userData.life = 40;


    scene.add(particle);

    particles.push(particle);

  }

}


// =====================
// CAMERA
// =====================

camera.position.set(
  0,
  9,
  18
);


// =====================
// GAME LOOP
// =====================

function animate(){

  requestAnimationFrame(animate);


  if(keys.left){

    player.rotation.y += 0.035;

  }

  if(keys.right){

    player.rotation.y -= 0.035;

  }


  const forward =
    new THREE.Vector3(

      Math.sin(player.rotation.y),

      0,

      -Math.cos(player.rotation.y)

    );


  if(keys.up){

    player.position.add(

      forward.clone()
      .multiplyScalar(0.14)

    );

  }


  if(keys.down){

    player.position.add(

      forward.clone()
      .multiplyScalar(-0.1)

    );

  }


  // BULLET MOVEMENT

  for(
    let i=bullets.length-1;
    i>=0;
    i--
  ){

    const bullet =
      bullets[i];


    bullet.position.add(

      bullet.userData.direction
      .clone()
      .multiplyScalar(0.7)

    );


    let removed = false;


    for(
      let j=enemies.length-1;
      j>=0;
      j--
    ){

      const enemy =
        enemies[j];


      if(

        bullet.position
        .distanceTo(
          enemy.position
        )

        < 2.8

      ){

        explode(
          enemy.position.clone()
        );


        scene.remove(enemy);

        scene.remove(bullet);


        enemies.splice(j,1);

        bullets.splice(i,1);


        document
        .getElementById(
          "enemyCount"
        )
        .textContent =
          enemies.length;


        removed = true;

        break;

      }

    }


    if(
      !removed &&
      bullet.position
      .distanceTo(
        player.position
      )
      > 100
    ){

      scene.remove(bullet);

      bullets.splice(i,1);

    }

  }


  // PARTICLES

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p =
      particles[i];


    p.position.add(
      p.userData.velocity
    );


    p.userData.velocity.y -=
      0.008;


    p.userData.life--;


    if(
      p.userData.life <= 0
    ){

      scene.remove(p);

      particles.splice(i,1);

    }

  }


  // CAMERA FOLLOW

  const offset =
    new THREE.Vector3(
      0,
      8,
      14
    );


  offset.applyAxisAngle(

    new THREE.Vector3(
      0,
      1,
      0
    ),

    player.rotation.y

  );


  const target =
    player.position
    .clone()
    .add(offset);


  camera.position.lerp(
    target,
    0.1
  );


  camera.lookAt(

    player.position.x,

    player.position.y+1.5,

    player.position.z

  );


  renderer.render(
    scene,
    camera
  );

}


animate();


// =====================
// RESIZE
// =====================

window.addEventListener(
  "resize",
  function(){

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );

  }
);

</script>

</body>
</html>
