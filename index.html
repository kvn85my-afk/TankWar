<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tank War ULTIMATE 9.0</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hpbox"><span id="hpText">140/140</span><div class="hp"><i id="hpFill"></i></div></div>
    <div class="wave"><b id="wave">WAVE 1</b><small id="remain">敌军 5</small></div>
    <div class="coins">🪙 <b id="coins">0</b></div>
    <button id="pause">Ⅱ</button>
  </div>
  <div id="joy"><i></i></div>
  <button id="repair">✚</button>
  <button id="fire"><span>💥</span>重炮</button>
  <div id="loading">LOADING HD BATTLEFIELD…</div>
</div>
<script src="game.js"></script>
</body></html>
