<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tank War ULTIMATE 3.0</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="menu" class="screen">
  <div class="badge">ULTIMATE 3.0</div>
  <h1>TANK WAR</h1><div class="sub">STEEL FRONT</div>
  <div class="stats">
    <div>🪙<b id="coinsMenu">0</b><span>金币</span></div>
    <div>⭐<b id="levelMenu">1</b><span>等级</span></div>
    <div>🏆<b id="bestMenu">1</b><span>最高波次</span></div>
  </div>
  <button id="startBtn">进入战场</button>
  <button id="garageBtn" class="secondary">车库 / 属性强化</button>
  <div id="garage" class="garage hidden">
    <h3>坦克强化</h3>
    <button data-up="hp">装甲 +20（🪙20）</button>
    <button data-up="damage">火力 +5（🪙20）</button>
    <button data-up="speed">速度 +5%（🪙20）</button>
    <p id="upgradeInfo"></p>
  </div>
</div>

<div id="game" class="screen hidden">
  <div id="hud">
    <div class="hpbox"><div id="hpbar"></div><span id="hptext">120/120</span></div>
    <div><b>WAVE <span id="wave">1</span></b><small>敌军 <span id="enemyCount">0</span></small></div>
    <div>🪙 <span id="coins">0</span></div>
    <button id="pauseBtn">Ⅱ</button>
  </div>
  <canvas id="canvas"></canvas>
  <div id="joy"><div id="stick"></div></div>
  <button id="fireBtn">FIRE</button>
  <div id="bossLabel" class="hidden">⚠ BOSS WAVE ⚠</div>
  <div id="message"></div><div id="vignette"></div>
</div>

<script src="game.js"></script>
</body>
</html>
