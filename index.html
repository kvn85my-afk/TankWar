<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tank War ULTIMATE</title><link rel="stylesheet" href="style.css"></head><body>
<div id="lobby" class="screen on"><div class="hero"><div class="badge">ULTIMATE</div><h1>TANK WAR</h1><p class="sub">STEEL FRONT</p><div class="tankLogo">⚙️<span>▰</span>💥</div><div class="panel"><div class="stats"><div>🪙<b id="lc">0</b><small>金币</small></div><div>⭐<b id="ll">1</b><small>等级</small></div><div>🏆<b id="lb">1</b><small>最高波次</small></div></div><button id="play" class="gold">进入战场</button><button id="garage">车库 / 属性强化</button></div></div></div>
<div id="garageScreen" class="screen"><header><button id="back">←</button><b>坦克车库</b><span>🪙 <i id="gc">0</i></span></header><div class="garageHero"><div class="bigTank">▰━━</div><h2>MK-IV “IRON WOLF”</h2><p>永久强化会自动保存</p></div><div id="cards" class="cards"></div></div>
<div id="gameScreen" class="screen"><canvas id="game"></canvas><div id="hud"><div class="hp"><i id="hp"></i></div><span id="hpt">100/100</span><div class="wave">WAVE <b id="wv">1</b><small>敌军 <i id="ec">0</i></small></div><div class="money">🪙 <b id="mc">0</b><button id="pause">Ⅱ</button></div></div><div id="bossHud" class="boss hide"><b>BOSS</b><div><i id="bossHp"></i></div></div><div id="joy"><i></i></div><button id="fire">FIRE</button><div id="toast"></div>
<div id="modal" class="overlay hide"><div class="modal"><h2 id="mt">暂停</h2><p id="md"></p><button id="primary" class="gold">继续</button><button id="secondary">返回大厅</button></div></div></div>
<script src="game.js"></script></body></html>
